services:
  postgres:
    image: postgres:16-alpine
    container_name: bestiario-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bestiario
      POSTGRES_PASSWORD: bestiario_dev
      POSTGRES_DB: bestiario
    ports:
      - "5432:5432"
    volumes:
      - bestiario-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bestiario -d bestiario"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: bestiario-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bestiario:bestiario_dev@postgres:5432/bestiario?schema=public
      PORT: 3000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:5174
      GITHUB_CALLBACK_URL: http://localhost:3000/api/auth/github/callback
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      COOKIE_SAME_SITE: lax
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: bestiario-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5174:80"

volumes:
  bestiario-postgres-data:
