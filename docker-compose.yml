services:
  postgres:
    image: postgres:16-alpine
    container_name: bestiario-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bestiario
      POSTGRES_PASSWORD: bestiario_dev
      POSTGRES_DB: bestiario
    ports:
      - "5432:5432"
    volumes:
      - bestiario-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bestiario -d bestiario"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bestiario-postgres-data:
